server {
    listen 80;

    # Serve React static files
    root /usr/share/nginx/html;
    index index.html;

    # For shared ALB deployments: strip the base path prefix before proxying.
    # For local docker-compose with empty BASE_PREFIX: these rewrites don't apply.
    rewrite ^__BASE_PREFIX__/api/(.*)$      /api/$1      break;
    rewrite ^__BASE_PREFIX__/api-docs/(.*)$ /api-docs/$1 break;

    # Proxy API calls to the backend service
    location /api/ {
        proxy_pass         http://__BACKEND_HOST__:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Proxy Swagger docs
    location /api-docs/ {
        proxy_pass         http://__BACKEND_HOST__:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # For shared ALB: serve the SPA under the configured base prefix
    location __BASE_PREFIX__/ {
        alias      /usr/share/nginx/html/;
        try_files  $uri $uri/ /index.html;
    }

    location = __BASE_PREFIX__ {
        return 301 __BASE_PREFIX__/;
    }

    # Root fallback — all unknown routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
