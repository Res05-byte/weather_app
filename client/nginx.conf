server {
    listen 80;

    # Serve React static files
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend service
    location /api/ {
        proxy_pass         http://__BACKEND_HOST__:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Proxy Swagger docs
    location /api-docs {
        proxy_pass         http://__BACKEND_HOST__:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Proxy health check endpoint
    location /health {
        proxy_pass         http://__BACKEND_HOST__:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Shared-ALB deployment path. Keep this explicit so local deployments do
    # not produce invalid or duplicate nginx location blocks.
    location /reshma/api/ {
        rewrite ^/reshma/api/(.*)$ /api/$1 break;
        proxy_pass         http://__BACKEND_HOST__:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /reshma/api-docs {
        rewrite ^/reshma/api-docs(.*)$ /api-docs$1 break;
        proxy_pass         http://__BACKEND_HOST__:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /reshma/health {
        rewrite ^ /health break;
        proxy_pass         http://__BACKEND_HOST__:4000;
    }

    location = /reshma {
        return 301 /reshma/;
    }

    location /reshma/ {
        rewrite ^/reshma/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    # Root fallback — all unknown routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
