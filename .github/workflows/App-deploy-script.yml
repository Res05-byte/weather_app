name: Deploy ECS

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server/weather-server

    env:
      AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          REPOSITORY_NAME="${ECR_REPOSITORY:-${GITHUB_REPOSITORY#*/}}"
          REPOSITORY_NAME=$(echo "$REPOSITORY_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          echo "REPOSITORY_NAME=$REPOSITORY_NAME" >> "$GITHUB_ENV"
          aws ecr describe-repositories --repository-names "$REPOSITORY_NAME" --region "$AWS_REGION" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "$REPOSITORY_NAME" --region "$AWS_REGION" >/dev/null

      - name: Build, tag and push image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$REPOSITORY_NAME:$IMAGE_TAG" -f Dockerfile.server .
          docker tag "$REGISTRY/$REPOSITORY_NAME:$IMAGE_TAG" "$REGISTRY/$REPOSITORY_NAME:latest"

          docker push "$REGISTRY/$REPOSITORY_NAME:$IMAGE_TAG"
          docker push "$REGISTRY/$REPOSITORY_NAME:latest"

      - name: Force new deployment
        run: |
          aws ecs update-service \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --service "${{ secrets.ECS_SERVICE }}" \
            --force-new-deployment