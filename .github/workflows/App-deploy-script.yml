name: Deploy ECS

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server/weather-server

    env:
      AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          REPOSITORY_NAME="${ECR_REPOSITORY:-${GITHUB_REPOSITORY#*/}}"
          REPOSITORY_NAME=$(echo "$REPOSITORY_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          echo "REPOSITORY_NAME=$REPOSITORY_NAME" >> "$GITHUB_ENV"
          aws ecr describe-repositories --repository-names "$REPOSITORY_NAME" --region "$AWS_REGION" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "$REPOSITORY_NAME" --region "$AWS_REGION" >/dev/null

      - name: Build, tag and push image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$REPOSITORY_NAME:$IMAGE_TAG" -f Dockerfile.server .
          docker tag "$REGISTRY/$REPOSITORY_NAME:$IMAGE_TAG" "$REGISTRY/$REPOSITORY_NAME:latest"

          docker push "$REGISTRY/$REPOSITORY_NAME:$IMAGE_TAG"
          docker push "$REGISTRY/$REPOSITORY_NAME:latest"

      - name: Force new deployment
        env:
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER || 'weather-app' }}
          ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
        run: |
          set -euo pipefail

          echo "Using ECS cluster: $ECS_CLUSTER"

          aws ecs describe-clusters --clusters "$ECS_CLUSTER" --region "$AWS_REGION" > /tmp/ecs-clusters.json

          if ! grep -q '"status": "ACTIVE"' /tmp/ecs-clusters.json; then
            echo "ECS cluster '$ECS_CLUSTER' is not active or does not exist."
            cat /tmp/ecs-clusters.json
            exit 1
          fi

          if [ -n "$ECS_SERVICE" ]; then
            SERVICE_NAME="$ECS_SERVICE"
          else
            SERVICE_NAMES=$(aws ecs list-services --cluster "$ECS_CLUSTER" --region "$AWS_REGION" --query 'serviceArns' --output text | awk -F'/' '{print $NF}')
            SERVICE_NAME=$(echo "$SERVICE_NAMES" | head -n 1)
          fi

          if [ -z "$SERVICE_NAME" ]; then
            echo "No ECS service was found in cluster '$ECS_CLUSTER'."
            aws ecs list-services --cluster "$ECS_CLUSTER" --region "$AWS_REGION"
            exit 1
          fi

          echo "Using ECS service: $SERVICE_NAME"

          aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$SERVICE_NAME" --region "$AWS_REGION" > /tmp/ecs-services.json || {
            echo "ECS service '$SERVICE_NAME' was not found in cluster '$ECS_CLUSTER'."
            aws ecs list-services --cluster "$ECS_CLUSTER" --region "$AWS_REGION"
            exit 1
          }

          if ! grep -q '"status": "ACTIVE"' /tmp/ecs-services.json; then
            echo "ECS service '$SERVICE_NAME' is not active or does not exist."
            cat /tmp/ecs-services.json
            exit 1
          fi

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$SERVICE_NAME" \
            --force-new-deployment