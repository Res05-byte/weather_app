server {
    listen 80;

    # Serve React static files
    root /usr/share/nginx/html;
    index index.html;

    # The shared ALB forwards the full original path, so requests arrive
    # here still prefixed with the configured base path (e.g. /reshma/api/v1/...).
    # Strip the prefix before proxying to the backend, which only knows
    # about unprefixed routes (/api/v1/..., /api-docs/...).
    rewrite ^__BASE_PREFIX__/api/(.*)$      /api/$1      break;
    rewrite ^__BASE_PREFIX__/api-docs/(.*)$ /api-docs/$1 break;

    # Proxy API calls to the backend service. The runtime entrypoint replaces
    # the placeholder with the appropriate backend hostname for the environment.
    location /api/ {
        proxy_pass         http://__BACKEND_HOST__:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # Proxy Swagger docs
    location /api-docs/ {
        proxy_pass         http://__BACKEND_HOST__:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # Serve the SPA under the configured base prefix used on the shared ALB.
    # Built with PUBLIC_URL set to that prefix, so index.html/JS/CSS reference
    # /<prefix>/static/... — alias back to the same html root and strip the
    # prefix so those files resolve.
    location __BASE_PREFIX__/ {
        alias      /usr/share/nginx/html/;
        try_files  $uri $uri/ /index.html;
    }

    location = __BASE_PREFIX__ {
        return 301 __BASE_PREFIX__/;
    }

    # Root fallback (e.g. ALB target-group health checks hit "/" directly,
    # bypassing the path-based listener rule) — all unknown routes serve
    # index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
